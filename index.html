<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101713"><link rel="manifest" href="manifest.json"><title>Momentum</title><style>
*{box-sizing:border-box}body{margin:0;background:#101713;color:#eef5ef;font:16px system-ui;color-scheme:dark}main{max-width:580px;margin:auto;padding:24px 18px 90px}h1{font-size:32px;margin:4px 0}h2{font-size:21px}small,.muted{color:#a6b7aa}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;background:#29382e;color:#eef5ef}button.primary{background:#b4e6bd;color:#14291b;font-weight:700}button:focus-visible{outline:3px solid white} .panel,article{background:#1c2921;border:1px solid #304035;border-radius:18px;padding:16px;margin:12px 0}article{border-left:4px solid var(--accent)}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0;overflow-wrap:anywhere}.check{width:48px;height:48px;font-size:24px}.checked{background:#b4e6bd;color:#14291b}progress{width:100%;accent-color:#b4e6bd;height:12px}nav{position:sticky;bottom:0;background:#101713;padding:12px;display:flex;gap:8px;justify-content:center}nav button{flex:1;max-width:180px}dialog{width:min(94%,480px);max-height:90vh;overflow:auto;background:#1c2921;color:inherit;border:1px solid #53695a;border-radius:20px;padding:20px}dialog::backdrop{background:#000a}label{display:block;margin:12px 0 5px}input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #53695a;border-radius:10px;background:#101713;color:inherit}fieldset{border:1px solid #53695a;border-radius:10px;margin:12px 0}fieldset label{display:inline-block;margin:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px;padding:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cell{text-align:center;padding:8px 0;border-radius:6px;background:#29382e}.hit{background:#b4e6bd;color:#14291b}.miss{background:#633c3c}.wide{width:100%}#notice{color:#ffd29a;white-space:pre-wrap}</style></head><body><main><small>YOUR DAILY ROUTINE</small><h1>Momentum</h1><p id="today" class="muted"></p><div id="notice" role="status"></div><section id="view"></section></main><nav><button onclick="show('today')">Today</button><button onclick="show('history')">History</button><button onclick="show('settings')">Settings</button></nav><dialog id="editor"><form id="form"><h2 id="editTitle">Create habit</h2><label for="name">Habit name</label><input id="name" required maxlength="150"><label for="emoji">Emoji</label><input id="emoji" maxlength="16" value="🌱"><label for="color">Color</label><input type="color" id="color" value="#b4e6bd"><label for="mode">Schedule</label><select id="mode"><option value="daily">Every day</option><option value="days">Specific weekdays</option><option value="weekly">Times per week</option><option value="interval">Every N days</option></select><fieldset id="days"><legend>Weekdays</legend></fieldset><div id="weekly"><label for="target">Days per week</label><input id="target" type="number" min="1" max="7" value="3"></div><div id="intervalBox"><label for="interval">Repeat every N days</label><input id="interval" type="number" min="1" max="365" value="2"></div><p class="muted">Schedule edits recalculate past streaks using the new schedule.</p><div class="row"><button type="button" onclick="editor.close()">Cancel</button><button class="primary grow">Save habit</button></div></form></dialog><script src="engine.js"></script><script src="app.js"></script></body></html>
